<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrun Career Opportunity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; padding: 32px 24px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
    h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 12px; text-align: center; }
    .notice { font-size: 14px; color: #555; background: #eef4ff; border-left: 4px solid #0056b3; padding: 12px; border-radius: 4px; margin-bottom: 24px; line-height: 1.4; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
    input:focus { border-color: #ff6600; }
    button { width: 100%; padding: 14px; background-color: #ff6600; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    button:hover { background-color: #e55b00; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Career Opportunity Overview</h1>
    <div class="notice">
      Please enter your name and phone number below to be directed immediately to the Sunrun Career Opportunity video presentation.
    </div>

    <form id="redirectForm">
      <div class="field">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" placeholder="John" required>
      </div>

      <div class="field">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" required>
      </div>

      <button type="submit">Watch Career Video</button>
    </form>
  </div>

  <script>
    document.getElementById('redirectForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const firstName = encodeURIComponent(document.getElementById('first_name').value.trim());
      const lastName = encodeURIComponent(document.getElementById('last_name').value.trim());
      const phone = encodeURIComponent(document.getElementById('phone').value.trim());

      const targetUrl = `https://sunrun.conveyour.com/c/ht0ie6noia/sunrun-opportunity?first_name=${firstName}&last_name=${lastName}&phone=${phone}`;

      window.location.href = targetUrl;
    });
  </script>

</body>
</html>
