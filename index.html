<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Energy Careers | Priority Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #ffffff;
      --accent-start: #ff5722;
      --accent-end: #ff9100;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --info-bg: #f0f7ff;
      --info-border: #c8e1fd;
      --info-text: #034887;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #172554 0%, #0b1120 75%), var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--text-main);
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      height: 6px;
      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
    }

    .content {
      padding: 36px 32px 32px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 100px;
      border: 1px solid #ffedd5;
      margin-bottom: 16px;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ea580c;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .sms-notice {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .sms-notice svg {
      flex-shrink: 0;
      margin-top: 2px;
    }

    .sms-notice p {
      font-size: 13px;
      line-height: 1.45;
      color: var(--info-text);
      font-weight: 500;
    }

    .sms-notice strong {
      color: #012950;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }
